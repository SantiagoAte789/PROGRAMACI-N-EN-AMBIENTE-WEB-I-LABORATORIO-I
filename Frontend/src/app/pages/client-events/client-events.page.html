
<section class="events-section container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="events-section__title">Próximos eventos</h2>
      <p class="text-secondary mb-0">
        Descubre los eventos disponibles para ti
      </p>
    </div>
  </div>

  <div class="row">

    @for(event of events; track event.codigo){
      <!-- <app-event-card [event]="event" /> -->

      <div class="col-12 col-md-4 col-lg-4 mb-4">
         <article class="event-card card h-100">
         <div class="event-card__image">
             <img
             src="https://placehold.co/600x350/212529/ffffff?text=Evento"
             class="card-img-top"
             alt="Imagen del evento"
             />
     
             <span class="event-card__status event-card__status--ticket">
             {{ event.estado }}
             </span>
         </div>
     
         <div class="card-body event-card__body">
             <div class="event-card__location">
             <i class="bi bi-geo-alt"></i>
             <span>{{ event.teatro }}</span>
             </div>
     
             <h3 class="event-card__title">
             {{ event.nombre }}
             </h3>
     
             <div class="event-card__date">
             <i class="bi bi-calendar-event"></i>
             <span>15 de noviembre de 2026</span>
             </div>
     
             <div class="event-card__footer">
             <a href="#" class="btn btn-primary w-100">
                 Ver evento
             </a>
             </div>
         </div>
         </article>
     </div>

    }

  </div>
</section>
